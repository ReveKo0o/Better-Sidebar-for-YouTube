<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Glass Tube</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Sıvı hissiyatını veren arka plan renk formları -->
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Ana Konteyner -->
    <div class="container">
        <!-- Üst Menü -->
        <header class="glass-panel nav">
            <div class="logo">LiquidTube</div>
            <input type="text" class="glass-input" placeholder="Ara...">
            <div class="profile-pic"></div>
        </header>

        <div class="layout">
            <!-- Yan Menü -->
            <aside class="glass-panel sidebar">
                <ul>
                    <li>Ana Sayfa</li>
                    <li>Trendler</li>
                    <li>Abonelikler</li>
                    <li>Geçmiş</li>
                    <li>Kitaplık</li>
                </ul>
            </aside>

            <!-- Video Izgarası -->
            <main class="video-grid">
                <!-- Video Kartı Örneği -->
                <div class="glass-panel video-card">
                    <div class="thumbnail"></div>
                    <div class="video-info">
                        <h3>Video Başlığı Burada Yer Alacak</h3>
                        <p>Kanal Adı</p>
                        <span>1.2M Görüntülenme • 2 gün önce</span>
                    </div>
                </div>
                <!-- Kartı çoğaltarak ızgarayı doldurabilirsiniz -->
                <div class="glass-panel video-card">
                    <div class="thumbnail"></div>
                    <div class="video-info">
                        <h3>Başka Bir Video Başlığı</h3>
                        <p>Kanal Adı</p>
                        <span>500 B Görüntülenme • 5 saat önce</span>
                    </div>
                </div>
                <div class="glass-panel video-card">
                    <div class="thumbnail"></div>
                    <div class="video-info">
                        <h3>Üçüncü Video Başlığı</h3>
                        <p>Kanal Adı</p>
                        <span>3M Görüntülenme • 1 hafta önce</span>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
